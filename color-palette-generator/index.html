<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="palette-app">
      <header class="app-header">
        <div class="app-meta">
          <h1 class="title">RandomColors</h1>
          <p class="sub-title">
            Click switch to copy and press generate to cycle colors.
          </p>
        </div>
        <button class="generate-btn" id="generatePaletteBtn">Generate</button>
      </header>
      <div class="swatch-grid" id="swatchsContainer"></div>
      <span class="toast" id="toast"></span>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
