<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic List</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="list-card">
      <header class="list-header">
        <h1>Dynamic List</h1>
        <span class="item-count" id="listCount">0 items</span>
      </header>
      <div class="list-form">
        <input id="userInput" type="text" placeholder="What need to be done?" />
        <button id="addBtn">Add</button>
      </div>
      <ul class="dynamic-list" id="listContainer"></ul>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
